name: bootstrap-smoke

on:
  workflow_dispatch:
  release:
    types: [published, prereleased]
  pull_request:
    paths:
      - "tools/install/**"
      - "tools/release/windows/**"
      - "tools/release/manifest/**"
      - "tools/qa/**"
      - "albion_dps/update/**"
      - ".github/workflows/bootstrap-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/install/**"
      - "tools/release/windows/**"
      - "tools/release/manifest/**"
      - "tools/qa/**"
      - "albion_dps/update/**"
      - ".github/workflows/bootstrap-smoke.yml"

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Windows bootstrap smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $logDir = Join-Path $PWD "artifacts\ci\windows-core"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $bootstrapLog = Join-Path $logDir "bootstrap.log"

          .\tools\install\windows\install.ps1 `
            -ProjectRoot "$PWD" `
            -VenvPath "$PWD\.venv-smoke" `
            -Python "$env:pythonLocation\python.exe" `
            -ForceRecreateVenv `
            -SkipRun *>&1 | Tee-Object -FilePath $bootstrapLog

          & "$PWD\.venv-smoke\Scripts\python.exe" `
            tools\install\common\smoke_check.py `
            --project-root "$PWD" `
            --profile auto `
            --artifact-name "AlbionCommandDesk-Setup-vX.Y.Z-x86_64.exe" `
            --report-path "$logDir\smoke-report.json" *>&1 | Tee-Object -FilePath $bootstrapLog -Append

          & "$PWD\.venv-smoke\Scripts\python.exe" `
            tools\qa\verify_release_update_flow.py *>&1 | Tee-Object -FilePath (Join-Path $logDir "update-flow.log")

          if (Test-Path "$PWD\assets\ux-baseline") {
            Copy-Item "$PWD\assets\ux-baseline\*.png" $logDir -ErrorAction SilentlyContinue
          }
      - name: Upload clean-machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-smoke-windows-core
          path: artifacts/ci/windows-core
          if-no-files-found: warn

  windows-capture-bundle-advisory:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and stage Npcap SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sdkZip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile $sdkZip
          if (Test-Path "C:\WpdPack") {
            Remove-Item -Recurse -Force "C:\WpdPack"
          }
          Expand-Archive -Path $sdkZip -DestinationPath "C:\WpdPack" -Force
      - name: Build Windows capture wheel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $wheelDir = Join-Path $PWD "artifacts\ci\windows-capture-bundle\wheels"
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null
          python -m pip install --upgrade pip wheel setuptools
          python -m pip wheel --wheel-dir $wheelDir "pcapy-ng>=1.0.0"
      - name: Run Windows capture-bundle bootstrap smoke (advisory)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $logDir = Join-Path $PWD "artifacts\ci\windows-capture-bundle"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $bootstrapLog = Join-Path $logDir "bootstrap.log"
          $wheel = Get-ChildItem -Path (Join-Path $logDir "wheels") -Filter "*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "Windows capture wheel was not produced."
          }

          .\tools\install\windows\install.ps1 `
            -ProjectRoot "$PWD" `
            -VenvPath "$PWD\.venv-smoke-capture" `
            -Python "$env:pythonLocation\python.exe" `
            -Profile capture `
            -CaptureWheelPath "$($wheel.FullName)" `
            -ForceRecreateVenv `
            -SkipRun *>&1 | Tee-Object -FilePath $bootstrapLog

          Select-String -Path $bootstrapLog -Pattern "Installing prebuilt Windows live capture backend" | Out-Null

          & "$PWD\.venv-smoke-capture\Scripts\python.exe" `
            tools\install\common\smoke_check.py `
            --project-root "$PWD" `
            --profile capture `
            --artifact-name "AlbionCommandDesk-WindowsCapture-vX.Y.Z.zip" `
            --report-path "$logDir\smoke-report.json" *>&1 | Tee-Object -FilePath $bootstrapLog -Append
      - name: Upload advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-smoke-windows-capture-bundle
          path: artifacts/ci/windows-capture-bundle
          if-no-files-found: warn

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpcap-dev \
            libegl1 \
            libgl1 \
            libx11-6 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxrender1 \
            libxi6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Linux bootstrap smoke
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$PWD/artifacts/ci/linux-core"
          mkdir -p "$EVIDENCE_DIR"

          bash ./tools/install/linux/install.sh \
            --project-root "$PWD" \
            --venv-path "$RUNNER_TEMP/acd-smoke-venv" \
            --python "$pythonLocation/bin/python" \
            --force-recreate-venv \
            --skip-run 2>&1 | tee "$EVIDENCE_DIR/bootstrap.log"

          "$RUNNER_TEMP/acd-smoke-venv/bin/python" \
            tools/install/common/smoke_check.py \
            --project-root "$PWD" \
            --profile auto \
            --artifact-name "AlbionCommandDesk-vX.Y.Z-x86_64.AppImage" \
            --report-path "$EVIDENCE_DIR/smoke-report.json" 2>&1 | tee -a "$EVIDENCE_DIR/bootstrap.log"

          "$RUNNER_TEMP/acd-smoke-venv/bin/python" \
            tools/qa/verify_release_update_flow.py 2>&1 | tee "$EVIDENCE_DIR/update-flow.log"

          cp assets/ux-baseline/*.png "$EVIDENCE_DIR/" 2>/dev/null || true
      - name: Upload clean-machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-smoke-linux-core
          path: artifacts/ci/linux-core
          if-no-files-found: warn

  linux-capture-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpcap-dev \
            libegl1 \
            libgl1 \
            libx11-6 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxrender1 \
            libxi6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Linux capture profile smoke (advisory)
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$PWD/artifacts/ci/linux-capture-advisory"
          mkdir -p "$EVIDENCE_DIR"

          bash ./tools/install/linux/install.sh \
            --project-root "$PWD" \
            --venv-path "$RUNNER_TEMP/acd-smoke-capture-venv" \
            --python "$pythonLocation/bin/python" \
            --profile capture \
            --force-recreate-venv \
            --skip-run 2>&1 | tee "$EVIDENCE_DIR/bootstrap.log"

          "$RUNNER_TEMP/acd-smoke-capture-venv/bin/python" \
            tools/install/common/smoke_check.py \
            --project-root "$PWD" \
            --profile capture \
            --artifact-name "AlbionCommandDesk-vX.Y.Z-x86_64.AppImage" \
            --report-path "$EVIDENCE_DIR/smoke-report.json" 2>&1 | tee -a "$EVIDENCE_DIR/bootstrap.log"
      - name: Upload advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-smoke-linux-capture-advisory
          path: artifacts/ci/linux-capture-advisory
          if-no-files-found: warn

  macos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          brew update
          brew install libpcap || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run macOS bootstrap smoke
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$PWD/artifacts/ci/macos-core"
          mkdir -p "$EVIDENCE_DIR"

          bash ./tools/install/macos/install.sh \
            --project-root "$PWD" \
            --venv-path "$RUNNER_TEMP/acd-smoke-venv" \
            --python "$pythonLocation/bin/python" \
            --force-recreate-venv \
            --skip-run 2>&1 | tee "$EVIDENCE_DIR/bootstrap.log"

          "$RUNNER_TEMP/acd-smoke-venv/bin/python" \
            tools/install/common/smoke_check.py \
            --project-root "$PWD" \
            --profile auto \
            --artifact-name "AlbionCommandDesk-vX.Y.Z-universal.dmg" \
            --report-path "$EVIDENCE_DIR/smoke-report.json" 2>&1 | tee -a "$EVIDENCE_DIR/bootstrap.log"

          "$RUNNER_TEMP/acd-smoke-venv/bin/python" \
            tools/qa/verify_release_update_flow.py 2>&1 | tee "$EVIDENCE_DIR/update-flow.log"

          cp assets/ux-baseline/*.png "$EVIDENCE_DIR/" 2>/dev/null || true
      - name: Upload clean-machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-smoke-macos-core
          path: artifacts/ci/macos-core
          if-no-files-found: warn

  macos-capture-advisory:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          brew update
          brew install libpcap || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run macOS capture profile smoke (advisory)
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$PWD/artifacts/ci/macos-capture-advisory"
          mkdir -p "$EVIDENCE_DIR"

          bash ./tools/install/macos/install.sh \
            --project-root "$PWD" \
            --venv-path "$RUNNER_TEMP/acd-smoke-capture-venv" \
            --python "$pythonLocation/bin/python" \
